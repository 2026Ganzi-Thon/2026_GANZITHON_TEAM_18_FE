<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 1020" width="1040" height="1020">
  <!-- 기존 personality-*.png 스타일 참고: 위는 하얗고 아래로 갈수록 진해지는 반투명 구슬 + 단색 이목구비 -->
  <defs>
    <radialGradient id="base" cx="40%" cy="15%" r="95%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#ffd3e8"/>
      <stop offset="1" stop-color="#ff8cc6"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="rim" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="ball"><circle cx="520" cy="510" r="500"/></clipPath>
  </defs>
  <g clip-path="url(#ball)">
    <circle cx="520" cy="510" r="500" fill="url(#base)"/>
    <ellipse cx="790" cy="470" rx="200" ry="190" fill="#c8a0ff" opacity="0.7" filter="url(#blur)"/>
    <ellipse cx="560" cy="860" rx="380" ry="190" fill="#ff6fb5" opacity="0.9" filter="url(#blur)"/>
    <ellipse cx="400" cy="170" rx="330" ry="170" fill="#ffffff" opacity="0.7" filter="url(#blur)"/>
    <circle cx="520" cy="510" r="497" fill="none" stroke="#ffffff" stroke-width="8" opacity="0.7" filter="url(#rim)"/>
  </g>
  <g fill="#8c2463" stroke="#8c2463" stroke-linecap="round">
    <!-- 처진 눈썹: 안쪽이 올라감 -->
    <path d="M270 335 L450 290" fill="none" stroke-width="42"/>
    <path d="M770 335 L590 290" fill="none" stroke-width="42"/>
    <!-- 눈 -->
    <ellipse cx="370" cy="440" rx="52" ry="66" stroke="none"/>
    <ellipse cx="670" cy="440" rx="52" ry="66" stroke="none"/>
    <!-- 입: 아래로 처진 곡선 -->
    <path d="M450 590 Q520 540 590 590" fill="none" stroke-width="40"/>
  </g>
</svg>
